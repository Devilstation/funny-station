- type: species
  id: Statue
  name: species-name-statue
  roundStart: true
  prototype: MobStatuePerson
  sprites: MobStatueSprites
  defaultSkinTone: "#87A5E7"
  markingLimits: MobHumanMarkingLimits
  maleFirstNames: NamesHumanFirst
  femaleFirstNames: NamesHumanLast
  dollPrototype: MobStatuePersonDummy
  skinColoration: TintedHues

