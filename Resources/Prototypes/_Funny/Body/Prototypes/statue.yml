- type: body
  id: Statue
  name: "statue"
  root: torso
  slots:
    head:
      part: HeadStatue
      connections:
      - torso
    torso:
      part: TorsoStatue
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head # Shitmed
    right arm:
      part: RightArmStatue
      connections:
      - right hand
    left arm:
      part: LeftArmStatue
      connections:
      - left hand
    right hand:
      part: RightHandStatue
    left hand:
      part: LeftHandStatue
    right leg:
      part: RightLegStatue
      connections:
      - right foot
    left leg:
      part: LeftLegStatue
      connections:
      - left foot
    right foot:
      part: RightFootStatue
    left foot:
      part: LeftFootStatue
