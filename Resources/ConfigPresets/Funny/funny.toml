[game]
hostname		 = "[EN][HRP] Funny Station - Reimu"
desc             = "Funny Station, the Funniest station around. 24/7 HRP lowpop oriented server with tons of content. Want highpop? Fuck you"
lobbyenabled     = true
soft_max_players = 10
lobbyduration    = 300 # 5 minutes lobby timer
map_pool		 = "FunnyMapPool"
map				 = "Reach"
role_timers		 = false

[infolinks]
discord    = "https://discord.gg/VSRj4D9Rp2"
forum      = "https://forum.funkystation.org"
github     = "https://github.com/devilstation/funny-station"
patreon    = "https://www.patreon.com/taydeo"
website    = "https://funkystation.org"

[hub]
advertise = false
tags = "lang:en,region:us_w"

[ic]
flavor_text = true
restricted_names = false

[chat]
motd = "Welcome to Funny Station! Read our extensive rules and metashield. No second chances!"

[ooc]
enable_during_round = true

[server]
rules_file = "FunnyRules"

[net]
max_connections = 1024

[vote]
restart_required_ratio = 0.5

[netres]
limit = 10.0

[admin]
see_own_notes = true
new_player_threshold = 600
alert.min_players_sharing_connection = 2

[atmos]
max_explosion_range = 32

[worldgen]
enabled = true